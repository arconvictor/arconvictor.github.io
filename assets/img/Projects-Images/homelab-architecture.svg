<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
  <rect width="1000" height="500" fill="#05070a"/>

  <text x="40" y="48" font-size="17" fill="#9aa7b8">$ ~/homelab topology --overview</text>

  <!-- Unified infrastructure panel -->
  <rect x="40" y="80" width="920" height="288" rx="14" fill="#0c1420" stroke="#00e5ff" stroke-width="2"/>
  <text x="62" y="120" font-size="19" font-weight="700" fill="#00e5ff">HOMELAB INFRASTRUCTURE</text>
  <text x="62" y="145" font-size="13" fill="#55637a">Proxmox VE</text>

  <rect x="62" y="165" width="275" height="50" rx="8" fill="#131d2c" stroke="#00e5ff" stroke-opacity="0.5"/>
  <text x="199" y="196" font-size="13.5" fill="#eaeaea" text-anchor="middle">DNS (HA pair)</text>

  <rect x="362" y="165" width="275" height="50" rx="8" fill="#131d2c" stroke="#ff3df0" stroke-opacity="0.5"/>
  <text x="499" y="196" font-size="13.5" fill="#eaeaea" text-anchor="middle">Reverse Proxy (Active / Standby)</text>

  <rect x="662" y="165" width="276" height="50" rx="8" fill="#131d2c" stroke="#00e5ff" stroke-opacity="0.5"/>
  <text x="800" y="196" font-size="13.5" fill="#eaeaea" text-anchor="middle">Secrets Vault</text>

  <rect x="62" y="230" width="275" height="50" rx="8" fill="#131d2c" stroke="#ff3df0" stroke-opacity="0.5"/>
  <text x="199" y="261" font-size="13.5" fill="#eaeaea" text-anchor="middle">Wiki / Docs</text>

  <rect x="362" y="230" width="275" height="50" rx="8" fill="#131d2c" stroke="#00e5ff" stroke-opacity="0.5"/>
  <text x="499" y="261" font-size="13.5" fill="#eaeaea" text-anchor="middle">Monitoring Stack</text>

  <rect x="662" y="230" width="276" height="50" rx="8" fill="#131d2c" stroke="#ff3df0" stroke-opacity="0.5"/>
  <text x="800" y="261" font-size="13.5" fill="#eaeaea" text-anchor="middle">Dedicated Backup Server</text>

  <rect x="62" y="295" width="876" height="50" rx="8" fill="#131d2c" stroke="#00e5ff" stroke-opacity="0.5"/>
  <text x="500" y="326" font-size="13.5" fill="#eaeaea" text-anchor="middle">25+ application &amp; service containers</text>

  <!-- Bottom summary bar -->
  <g font-size="14" fill="#eaeaea">
    <circle cx="55" cy="397" r="4.5" fill="#00e5ff"/>
    <text x="70" y="402">Firewall: default-deny, per-service rules</text>

    <circle cx="55" cy="426" r="4.5" fill="#ff3df0"/>
    <text x="70" y="431">Keepalived · VRRP · shared VIP for reverse-proxy HA</text>

    <circle cx="55" cy="455" r="4.5" fill="#00e5ff"/>
    <text x="70" y="460">40+ services monitored (Grafana/Loki/Prometheus)</text>

    <circle cx="55" cy="484" r="4.5" fill="#ff3df0"/>
    <text x="70" y="489">Automatic failover on reverse-proxy loss (~2-3s)</text>
  </g>
</svg>
